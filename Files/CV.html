<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mahmoud Alyosify | CVs</title>

  <link rel="icon" href="MahmoudIcon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    :root {
      --main-color: #007bff;
      --hover-color: #0056b3;
      --background: #ffffff;
      --text-color: #1a1a1a;
      --font: 'Georgia', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font);
      background-color: var(--background);
      color: var(--text-color);
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 0.5em;
      font-size: 2rem;
    }

    .nav-links, .cv-buttons {
      text-align: center;
      margin: 20px 0;
    }

    .nav-links a, .cv-buttons button {
      display: inline-block;
      background-color: var(--main-color);
      color: white;
      padding: 10px 20px;
      margin: 5px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: 0.3s;
    }

    .nav-links a:hover,
    .cv-buttons button:hover {
      background-color: var(--hover-color);
    }

    .container {
      position: relative;
      padding-top: 56.25%;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-top: 20px;
    }

    .responsive-iframe {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      border: none;
    }

    hr {
      margin: 30px 0;
      border: none;
      border-top: 1px solid #ccc;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.5rem;
      }

      .nav-links a, .cv-buttons button {
        font-size: 16px;
        padding: 10px;
      }
    }
  </style>
</head>
<body>

  <h1>Mahmoud Sayed Youssef</h1>
  <h1>Choose Resume to View</h1>

  <div class="nav-links">
    <a href="../index.html"><i class="fa fa-arrow-left"></i> Back to Website</a>
  </div>

  <div class="cv-buttons">
    <button onclick="showCV('ta')">Teaching Assistant CV</button>
    <button onclick="showCV('ml')">Machine Learning Engineer CV</button>
  </div>

  <hr />

  <div class="container">
    <iframe id="cvFrame" class="responsive-iframe" src="Mahmoud-Alyosify-ML-CV.pdf"></iframe>
  </div>

  <script>
    function showCV(type) {
      const frame = document.getElementById('cvFrame');
      if (type === 'ta') {
        frame.src = 'Mahmoud-Alyosify-TA-CV.pdf';
      } else if (type === 'ml') {
        frame.src = 'Mahmoud-Alyosify-ML-CV.pdf';
      }
    }
  </script>

  <noscript>
    <p style="text-align:center; color:red; font-weight:bold;">
      JavaScript is disabled. You can download the CVs manually from your browser.
    </p>
  </noscript>

</body>
</html>
